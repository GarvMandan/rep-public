    </div>`;
}

// One scale places bars, gridlines and labels; every label names a value reached.
function barChart(weeks) {
  const W = 520, H = 170, padL = 40, padB = 26, padT = 10, padR = 6;
  const max = Math.max(...weeks.map((w) => w.volume), 1);
  const nice = Math.ceil(max / 1000) * 1000 || 1000;
  const iw = W - padL - padR, ih = H - padB - padT;
  const bw = Math.min(48, (iw / weeks.length) * 0.62);
  const step = iw / weeks.length;

  const grid = [0, 0.5, 1].map((f) => {
    const y = padT + ih - f * ih;
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2C3441" stroke-width="1"/>
      <text x="${padL - 7}" y="${y + 4}" fill="#5B6675" font-size="10" text-anchor="end">${fmtVol(nice * f)}</text>`;
  }).join('');

  const bars = weeks.map((w, i) => {
    const h = Math.max(2, (w.volume / nice) * ih);
    const x = padL + i * step + (step - bw) / 2;
    const y = padT + ih - h;
    const last = i === weeks.length - 1;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${last ? '#E4FF3A' : '#2C3441'}"/>
      <text x="${x + bw / 2}" y="${H - 9}" fill="#5B6675" font-size="10" text-anchor="middle">${w.week.slice(5).replace('-', '/')}</text>`;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Weekly training volume, most recent ${weeks.length} weeks, peak ${fmtVol(max)} pounds">
    ${grid}${bars}</svg>`;
}

function lineChart(points) {
  const W = 480, H = 150, padL = 38, padB = 24, padT = 12, padR = 10;
  const vals = points.map((p) => p.est1RM);
  const min = Math.min(...vals), max = Math.max(...vals);
  const lo = Math.floor((min * 0.94) / 5) * 5, hi = Math.ceil((max * 1.04) / 5) * 5;
  const span = Math.max(1, hi - lo);
  const iw = W - padL - padR, ih = H - padB - padT;
  const X = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const Y = (v) => padT + ih - ((v - lo) / span) * ih;

  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.est1RM).toFixed(1)}`).join(' ');
  const area = `${d} L${X(points.length - 1).toFixed(1)},${padT + ih} L${X(0).toFixed(1)},${padT + ih} Z`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Estimated one-rep max over ${points.length} sessions, from ${Math.round(vals[0])} to ${Math.round(vals[vals.length - 1])} pounds">
    ${[lo, hi].map((v) => `
      <line x1="${padL}" y1="${Y(v)}" x2="${W - padR}" y2="${Y(v)}" stroke="#2C3441" stroke-width="1"/>
      <text x="${padL - 6}" y="${Y(v) + 4}" fill="#5B6675" font-size="10" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="rgba(228,255,58,.10)"/>
    <path d="${d}" fill="none" stroke="#E4FF3A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.est1RM).toFixed(1)}" r="${i === points.length - 1 ? 4 : 2.5}"
      fill="${i === points.length - 1 ? '#E4FF3A' : '#8C97A8'}"/>`).join('')}
  </svg>`;
}

// ═══ Render ═══════════════════════════════════════════════════════════════
function render() {
  const st = store.getState();
  const scrollY = window.scrollY;
  // Preserve focus and caret across re-render, so typing in search isn't lost.
  const act = document.activeElement;
  const focusKey = act?.dataset?.act;
  const caret = act?.selectionStart ?? null;

  // Order matters: account first, then onboarding, then the app. An account is
  // required, but only the initial check needs the network — after that the
  // session persists and everything below works offline.
  if (CLOUD_ENABLED && !authResolved) {
    root.innerHTML = `
      <div class="topbar"><div class="wordmark">REP<span>·</span>PUBLIC</div></div>
      <div class="empty"><h2>Loading…</h2></div>`;
  } else if (CLOUD_ENABLED && !account) {
    root.innerHTML = renderAuthGate();
  } else if (!st.profile) {
    root.innerHTML = `<div class="topbar"><div class="wordmark">REP<span>·</span>PUBLIC</div></div>${renderSetup()}`;
  } else {
    const inSession = !!st.activeSession;
    const body =
      view === 'progress' ? renderProgress(st)
      : view === 'plan' ? renderPlan(st)
      : view === 'feed' ? renderFeed()
      : renderToday(st);

    // Four tabs plus an account control is tight on a phone, so the account
    // button carries the sync state instead of a separate indicator.
    const dot = !account ? 'off'
      : syncState.syncing ? 'busy'
      : syncState.lastError ? 'err'
      : syncState.online ? 'on' : 'off';

    const tabs = [
      ['today', inSession ? 'Session' : 'Today'],
      ['progress', 'Stats'],
      ['plan', 'Plan'],
    ];
    if (CLOUD_ENABLED) tabs.splice(1, 0, ['feed', 'Feed']);

    root.innerHTML = `
      <div class="topbar">
        <div class="tabs" role="tablist" style="flex:1">
          ${tabs.map(([k, l]) =>
            `<button class="tab" role="tab" aria-selected="${view === k}" data-act="view" data-v="${k}">${l}</button>`).join('')}
        </div>
        ${CLOUD_ENABLED ? `
          <button class="row" style="gap:7px" data-act="${account ? 'open-account' : 'open-auth'}" data-v="signin"
                  aria-label="${account ? 'Account' : 'Sign in'}">
            <span class="syncdot ${dot}"></span>
            ${account ? avatarHTML(account, 'sm') : '<span class="avatar sm">↗</span>'}
          </button>` : ''}
      </div>
      ${body}
      ${renderSheet(st)}`;
  }

  window.scrollTo(0, scrollY);

  if (focusKey) {
    const next = root.querySelector(`[data-act="${focusKey}"]`);
    if (next && typeof next.focus === 'function' && next.tagName === 'INPUT') {
      next.focus();
      if (caret != null && next.setSelectionRange) {
        try { next.setSelectionRange(caret, caret); } catch { /* type doesn't support it */ }
      }
    }
  }

  if (restUntil && Date.now() < restUntil) tickRest();
}

// ═══ Actions ══════════════════════════════════════════════════════════════
// ═══ Cloud helpers ════════════════════════════════════════════════════════

/** Keep a copy of the account so the app can open signed-in while offline. */
function cacheAccount() {
  try {
    if (account) localStorage.setItem('liftlog.account', JSON.stringify(account));
    else localStorage.removeItem('liftlog.account');
  } catch { /* storage unavailable; session is memory-only */ }
}

async function runSync(opts = {}) {
  if (!account) return;
  syncState = { ...syncState, syncing: true };
  render();

  const r = await sync.run(opts);

  syncState = {
    syncing: false,
    online: !r.offline,
    lastError: r.error || null,
    lastAt: r.ok ? Date.now() : syncState.lastAt,
  };
  render();
}

async function loadFeed() {
  if (!account) return;
  try {
    const r = await api.feed();
    feedCache = { items: r.items, error: null };
  } catch (err) {
    feedCache = {
      items: [],
      error: err.offline ? 'You are offline. The feed will load when you reconnect.' : err.message,
    };
  }
  render();
}

async function loadFriends() {
  if (!account) return;
  try {
    friendsCache = await api.friends();
  } catch {
    friendsCache = { friends: [], incoming: [], outgoing: [] };
  }
  render();
}

/**
 * Google Sign-In via the Identity Services library, loaded on demand so the
 * script is never fetched for users who do not use it.
 */
function promptGoogle() {
  return new Promise((resolve, reject) => {
    if (!GOOGLE_CLIENT_ID) return reject(new Error('Google sign-in is not configured.'));

    const start = () => {
      try {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: (res) => resolve(res.credential),
        });
        google.accounts.id.prompt((notif) => {
          if (notif.isNotDisplayed?.() || notif.isSkippedMoment?.()) {
            reject(new Error('Google sign-in was dismissed.'));
          }
        });
      } catch (e) { reject(e); }
    };

    if (window.google?.accounts?.id) return start();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = start;
    s.onerror = () => reject(new Error('Could not reach Google. Check your connection.'));
    document.head.appendChild(s);
  });
}

/** If we arrived via an invite link, become friends now that we have an account. */
async function redeemPendingInvite() {
  if (!pendingInvite || !account) return;
  try {
    const r = await api.acceptInvite(pendingInvite.code);
    authNotice = `You and ${r.friend.displayName} are now friends.`;
    friendsCache = null;
  } catch {
    // An expired or already-used invite is not worth blocking sign-in over.
  }
  pendingInvite = null;
  // Drop the code from the URL so a refresh does not try to redeem it twice.
  try { history.replaceState(null, '', location.pathname); } catch { /* ignore */ }
}

/** Read ?invite=CODE and look up who sent it, before sign-in. */
async function readInviteFromUrl() {
  const code = new URLSearchParams(location.search).get('invite');
  if (!code || !CLOUD_ENABLED) return;
  try {
    const r = await api.peekInvite(code.toUpperCase());
    pendingInvite = { code: r.code, from: r.from, note: r.note };
    authMode = 'signup';   // an invited person almost certainly needs an account
  } catch { /* expired or bad code: fall through to the normal sign-in screen */ }
}

/**
 * Restore a signed-in session on load, then sync in the background.
 *
 * Offline is handled deliberately: if there is a stored token but the network
 * is unreachable, we keep the user signed in with whatever the last known
 * account was rather than locking them out of the gym.
 */
async function restoreAccount() {
  if (!CLOUD_ENABLED) { authResolved = true; return; }

  await readInviteFromUrl();

  if (!(await api.isSignedIn())) { authResolved = true; render(); return; }

  // Trust the cached account immediately so the app opens instantly, then
  // confirm with the server.
  try {
    account = JSON.parse(localStorage.getItem('liftlog.account') || 'null');
  } catch { account = null; }
  authResolved = true;
  render();

  try {
    account = await api.me();
    cacheAccount();
    render();
    await redeemPendingInvite();
    await runSync();
    await loadFeed();
  } catch (err) {
    if (err.unauthorized) {
      // The token was revoked or expired — a real sign-out, not a blip.
      await api.logout();
      account = null;
      cacheAccount();
    } else {
      // Offline: stay signed in on the cached account.
      syncState = { ...syncState, online: false };
    }
    render();
  }
}

function readDraftInputs() {
  root.querySelectorAll('[data-f]').forEach((el) => {
    const f = el.dataset.f;
    draft[f] = el.type === 'number' ? (Number(el.value) || draft[f]) : el.value;
  });
}

function openSheet(next) {
  sheet = next;
  search = ''; filterMuscle = null;
  render();
}
function closeSheet() { sheet = null; search = ''; filterMuscle = null; render(); }

function startRest(seconds) {
  clearInterval(restTimer);
  restUntil = Date.now() + seconds * 1000;
  tickRest();
}

// The timer ticks against a wall-clock deadline and re-queries the panel each
// second, so a full re-render mid-rest doesn't strand or reset the countdown.
function tickRest() {
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    if (!restUntil) { clearInterval(restTimer); return; }
    const panel = root.querySelector('.rest');
    if (panel) panel.outerHTML = renderRest();
    if (Date.now() >= restUntil) clearInterval(restTimer);
  }, 1000);
}

async function logReps(reps) {
  const st = store.getState();
  const ex = st.activeSession.exercises[activeEx];
  const setIdx = ex.sets.findIndex((x) => !x.done);
  if (setIdx < 0) return;

  const advice = await store.logSet(activeEx, setIdx, reps, ex.sets[setIdx].weight);
  coach = advice ? advice.reason : null;

  // Rest scales with how heavy the lift is — a compound needs more than a curl.
  const meta = getExercise(ex.exerciseId);
  if (advice) startRest(meta?.tier === 'primary' ? 180 : meta?.tier === 'secondary' ? 120 : 75);
  else { restUntil = null; clearInterval(restTimer); }

  render();
}

root.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const st = store.getState();

  // Tapping the backdrop closes the sheet; clicks inside must not.
  if (act === 'scrim') { if (e.target === el) closeSheet(); return; }

  switch (act) {
    case 'view': view = v; coach = null; sheet = null; render(); window.scrollTo(0, 0); break;

    // ── Onboarding ──
    case 'step':
      if (Number(v) > setupStep) readDraftInputs();
      setupStep = Number(v); search = ''; filterMuscle = null;
      render(); window.scrollTo(0, 0); break;

    case 'equip': {
      const i = draft.equipment.indexOf(v);
      if (i >= 0) { if (draft.equipment.length > 1) draft.equipment.splice(i, 1); }
      else draft.equipment.push(v);
      readDraftInputs(); render(); break;
    }
    case 'preset': draft.presetId = v; render(); break;
    case 'day': {
      const i = draft.trainingDays.indexOf(v);
      if (i >= 0) draft.trainingDays.splice(i, 1); else draft.trainingDays.push(v);
      render(); break;
    }
    case 'fav': {
      const i = draft.favorites.indexOf(v);
      if (i >= 0) draft.favorites.splice(i, 1); else draft.favorites.push(v);
      render(); break;
    }
    case 'finish': {
      const { presetId, trainingDays, ...profile } = draft;
      await store.completeSetup(profile, { presetId, trainingDays });
      view = 'today'; search = ''; filterMuscle = null;
      render(); window.scrollTo(0, 0); break;
    }

    // ── Search / filters ──
    case 'clear-search': search = ''; render(); break;
    case 'fmuscle': filterMuscle = v || null; render(); break;
    case 'toggle-equip-filter': onlyMyEquipment = !onlyMyEquipment; render(); break;

    // ── Session ──
    case 'start': {
      await store.startSession(v);
      activeEx = 0; coach = null; restUntil = null;
      view = 'today'; render(); window.scrollTo(0, 0); break;
    }
    case 'log': await logReps(Number(v)); break;
    case 'log-other': {
      const ex = st.activeSession.exercises[activeEx];
      const setIdx = ex.sets.findIndex((x) => !x.done);
      const n = prompt(`Reps completed on set ${setIdx + 1}?`, String(ex.sets[setIdx].targetReps));
      if (n !== null && Number.isFinite(Number(n))) await logReps(Math.max(0, Math.round(Number(n))));
      break;
    }
    case 'unlog':
      await store.unlogSet(Number(el.dataset.ex), Number(el.dataset.set));
      coach = null; render(); break;

    case 'w+': case 'w-': {
      const ex = st.activeSession.exercises[activeEx];
      const setIdx = ex.sets.findIndex((x) => !x.done);
      if (setIdx < 0) break;
      const step = ex.increment || 5;
      const next = Math.max(0, ex.sets[setIdx].weight + (act === 'w+' ? step : -step));
      await store.overrideWeight(activeEx, setIdx, next);
      render(); break;
    }
    // ── Typing an exact weight ──
    case 'set-weight': {
      const ex = st.activeSession?.exercises[activeEx];
      const setIdx = ex?.sets.findIndex((x) => !x.done) ?? -1;
      if (setIdx < 0) break;
      openSheet({ kind: 'weight', value: ex.sets[setIdx].weight });
      // Select the field so typing replaces rather than appends.
      setTimeout(() => root.querySelector('#w-input')?.select(), 60);
      break;
    }
    case 'weight-jump': {
      const ex = st.activeSession.exercises[activeEx];
      const setIdx = ex.sets.findIndex((x) => !x.done);
      const base = Number(sheet.value ?? ex.sets[setIdx].weight) || 0;
      sheet = { ...sheet, value: Math.max(0, base + Number(v)) };
      render();
      break;
    }
    case 'weight-set':
      sheet = { ...sheet, value: Number(v) };
      render();
      break;
    case 'weight-apply': {
      const ex = st.activeSession.exercises[activeEx];
      const setIdx = ex.sets.findIndex((x) => !x.done);
      const raw = Number(root.querySelector('#w-input')?.value ?? sheet.value);
      if (!Number.isFinite(raw) || raw < 0) { closeSheet(); break; }

      // Apply to this set and every later un-logged set of the same exercise,
      // so one correction fixes the whole exercise rather than one set.
      await store.overrideWeight(activeEx, setIdx, raw);
      for (let j = setIdx + 1; j < ex.sets.length; j++) {
        if (!ex.sets[j].done) await store.overrideWeight(activeEx, j, raw);
      }
      closeSheet();
      break;
    }

    case 'add-set': await store.addSet(activeEx); render(); break;
    case 'swap-ex': openSheet({ kind: 'swap' }); break;
    case 'do-swap': await store.swapExercise(activeEx, v); coach = null; closeSheet(); break;
    case 'add-ex-session': openSheet({ kind: 'addToSession' }); break;
    case 'do-add-session': await store.addExerciseToSession(v); closeSheet(); break;

    case 'next-ex':
      if (activeEx + 1 < st.activeSession.exercises.length) { activeEx++; coach = null; restUntil = null; render(); window.scrollTo(0, 0); }
      break;
    case 'prev-ex': if (activeEx > 0) { activeEx--; coach = null; render(); window.scrollTo(0, 0); } break;
    case 'goto-ex': activeEx = Number(v); coach = null; render(); window.scrollTo(0, 0); break;
    case 'skip-rest': restUntil = null; clearInterval(restTimer); render(); break;

    case 'finish-session': {
      const done = await store.finishSession();
      clearInterval(restTimer); restUntil = null; coach = null;
      view = 'progress'; render(); window.scrollTo(0, 0);
      if (done) setTimeout(() => alert(`${done.name} logged.\n\nNext time's weights are already set — check Today.`), 60);
      // Push the finished workout so it reaches friends' feeds. Fire and forget:
      // it is already saved locally, and sync retries on the next app open.
      if (account) { runSync().then(() => { feedCache = null; loadFeed(); }); }
      break;
    }
    case 'discard':
      if (confirm('Discard this workout? Nothing will be saved.')) {
        await store.discardSession(); clearInterval(restTimer); restUntil = null; render();
      }
      break;

    // ── Plan builder ──
    case 'assign': openSheet({ kind: 'assign', weekday: v }); break;
    case 'pick-day': await store.assignDay(sheet.weekday, v || null); closeSheet(); break;
    case 'edit-day': openSheet({ kind: 'editDay', dayId: v }); break;
    case 'back-to-day': openSheet({ kind: 'editDay', dayId: v }); break;
    case 'new-day': {
      const name = prompt('Name this workout', 'New workout');
      if (!name) break;
      const day = await store.addDay(name.trim() || 'New workout', []);
      openSheet({ kind: 'editDay', dayId: day.id });
      break;
    }
    case 'pin-day': await store.pinDay(v); render(); break;
    case 'unpin-day':
      if (confirm('Hand this workout back to the app? Your chosen exercises will be replaced by automatic picks.')) {
        await store.unpinDay(v); render();
      }
      break;
    case 'open-add-ex': openSheet({ kind: 'addExercise', dayId: v }); break;
    case 'pick-ex': {
      const day = getDay(st.plan, sheet.dayId);
      const has = Array.isArray(day?.exercises) && day.exercises.some((x) => x.exerciseId === v);
      if (has) await store.removeExerciseFromDay(sheet.dayId, v);
      else await store.addExerciseToDay(sheet.dayId, v);
      render(); break;
    }
    case 'rm-ex': await store.removeExerciseFromDay(el.dataset.day, v); render(); break;
    case 'sets+': {
      const day = getDay(st.plan, el.dataset.day);
      const cur = day.exercises.find((x) => x.exerciseId === v);
      await store.setExerciseSets(el.dataset.day, v, (cur?.sets || 3) + 1);
      render(); break;
    }
    case 'sets-': {
      const day = getDay(st.plan, el.dataset.day);
      const cur = day.exercises.find((x) => x.exerciseId === v);
      await store.setExerciseSets(el.dataset.day, v, Math.max(1, (cur?.sets || 3) - 1));
      render(); break;
    }
    case 'move-ex': await store.moveExerciseInDay(el.dataset.day, v, Number(el.dataset.d)); render(); break;
    case 'dup-day': {
      const copy = await store.duplicateDay(v);
      if (copy) openSheet({ kind: 'editDay', dayId: copy.id });
      break;
    }
    case 'del-day': {
      const day = getDay(st.plan, v);
      if (confirm(`Delete “${day?.name}”? Any days running it become rest days. Logged history is kept.`)) {
        await store.removeDay(v); closeSheet();
      }
      break;
    }

    case 'set-equip': {
      const eq = [...st.profile.equipment];
      const i = eq.indexOf(v);
      if (i >= 0) { if (eq.length > 1) eq.splice(i, 1); } else eq.push(v);
      await store.updateProfile({ equipment: eq });
      render(); break;
    }

    case 'detail': openSheet({ kind: 'detail', exerciseId: v }); break;
    case 'session': openSheet({ kind: 'session', sessionId: v }); break;
    case 'close-sheet': closeSheet(); break;

    // ── Account ──
    case 'auth-mode':
      authError = null; authNotice = null;
      authMode = v;
      render();
      break;

    case 'forgot-password': {
      const email = root.querySelector('#au-email')?.value.trim()
        || prompt('Which email address?') || '';
      if (!email) break;
      authError = null; authBusy = true; render();
      try {
        const r = await api.forgotPassword(email);
        authNotice = r.message;
      } catch (err) {
        authError = err.offline ? 'No connection. Try again once you reconnect.' : err.message;
      } finally { authBusy = false; render(); }
      break;
    }

    case 'resend-verify': {
      authBusy = true; authNotice = null; render();
      try {
        const r = await api.resendVerification();
        authNotice = r.sent
          ? 'Sent. Check your inbox, including spam.'
          : (r.message || 'Could not send the email just now.');
      } catch (err) {
        authNotice = err.offline ? 'You are offline right now.' : err.message;
      } finally { authBusy = false; render(); }
      break;
    }

    case 'check-verify': {
      // They clicked the link elsewhere; re-fetch rather than making them reload.
      try {
        account = await api.me();
        cacheAccount();
        if (account.emailVerified) {
          authNotice = null;
          feedCache = null;
          await loadFeed();
        } else {
          authNotice = 'Not verified yet. Open the link in the email we sent.';
        }
      } catch { /* offline; leave state as it is */ }
      render();
      break;
    }
    case 'open-account': openSheet({ kind: 'account' }); break;

    case 'do-signin': case 'do-signup': {
      const email = root.querySelector('#au-email')?.value.trim() || '';
      const password = root.querySelector('#au-pass')?.value || '';
      const username = root.querySelector('#au-user')?.value.trim() || '';
      const signingUp = act === 'do-signup';

      authError = null; authBusy = true; render();
      try {
        // Data already on this device belongs to the person creating the
        // account, so it wins the first sync rather than being replaced.
        const hadLocal = !!store.getState().profile;
        account = signingUp
          ? await api.register({ email, password, username })
          : await api.login({ email, password });

        cacheAccount();
        closeSheet();
        await runSync({ preferLocal: signingUp && hadLocal });
        await redeemPendingInvite();
        await loadFeed();
      } catch (err) {
        authError = err.offline ? 'No connection. Check your signal and try again.' : err.message;
      } finally {
        authBusy = false;
        render();
      }
      break;
    }

    case 'google-signin': {
      authError = null; authBusy = true; render();
      try {
        const idToken = await promptGoogle();
        if (idToken) {
          const hadLocal = !!store.getState().profile;
          account = await api.loginWithGoogle(idToken);
          cacheAccount();
          closeSheet();
          await runSync({ preferLocal: hadLocal });
          await redeemPendingInvite();
          await loadFeed();
        }
      } catch (err) {
        authError = err.message || 'Google sign-in failed.';
      } finally {
        authBusy = false;
        render();
      }
      break;
    }

    case 'signout':
      if (confirm('Sign out? Your training data stays on this device.')) {
        await api.logout();
        account = null; feedCache = null; friendsCache = null; invitesCache = null;
        cacheAccount();
        closeSheet();
      }
      break;

    case 'sync-now': await runSync(); render(); break;

    // ── Invites ──
    case 'open-invite':
      authBusy = false;
      openSheet({ kind: 'invite' });
      try { invitesCache = await api.listInvites(); render(); } catch { /* non-essential */ }
      break;

    case 'send-invite': {
      const email = root.querySelector('#inv-email')?.value.trim() || '';
      const note = root.querySelector('#inv-note')?.value.trim() || '';
      authBusy = true; render();
      try {
        const r = await api.createInvite(email || null, note || null);
        sheet = { ...sheet, created: { link: r.link, emailed: r.emailed, to: email } };
        invitesCache = await api.listInvites().catch(() => invitesCache);
      } catch (err) {
        alert(err.offline ? 'You are offline — invites need a connection.' : err.message);
      } finally { authBusy = false; render(); }
      break;
    }

    case 'new-invite': sheet = { ...sheet, created: null }; render(); break;

    case 'copy-invite':
      try {
        await navigator.clipboard.writeText(v);
        el.textContent = 'Copied';
        setTimeout(() => { if (el.isConnected) el.textContent = 'Copy link'; }, 1600);
      } catch {
        // Clipboard is blocked in some contexts; selecting the text is the fallback.
        root.querySelector('[data-act="invite-link"]')?.select();
      }
      break;

    case 'share-invite':
      try {
        await navigator.share({
          title: 'Rep Public',
          text: 'Train with me — it tells you exactly what to lift and adjusts as you go.',
          url: v,
        });
      } catch { /* the user dismissed the share sheet */ }
      break;

    // ── Friends ──
    case 'open-friends':
      openSheet({ kind: 'friends' });
      await loadFriends();
      break;

    case 'add-friend': {
      try {
        await api.addFriend(v);
        await loadFriends();
        // Reflect the new state in the visible search results too.
        if (sheet?.results) {
          sheet.results = sheet.results.map((u) =>
            u.username === v ? { ...u, friendStatus: 'pending', outgoing: true } : u);
        }
        render();
      } catch (err) { alert(err.message); }
      break;
    }
    case 'accept-friend':
      try { await api.acceptFriend(v); await loadFriends(); feedCache = null; await loadFeed(); }
      catch (err) { alert(err.message); }
      break;
    case 'remove-friend':
      if (confirm('Remove this friend? You will stop seeing each other’s workouts.')) {
        try { await api.removeFriend(v); await loadFriends(); feedCache = null; await loadFeed(); }
        catch (err) { alert(err.message); }
      }
      break;

    // ── Feed ──
    case 'reload-feed': feedCache = null; render(); await loadFeed(); break;
    case 'kudos': {
      // Optimistic: the tap should feel instant, and a failed kudos is harmless.
      const item = feedCache?.items.find((i) => i.id === v);
      if (item) {
        item.kudoed = !item.kudoed;
        item.kudos += item.kudoed ? 1 : -1;
        render();
      }
      try { await api.toggleKudos(v); }
      catch { if (item) { item.kudoed = !item.kudoed; item.kudos += item.kudoed ? 1 : -1; render(); } }
      break;
    }

    // ── Data ──
    case 'export': {
      const blob = new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `liftlog-${todayISO()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = async () => {
        const file = inp.files?.[0];
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!data.profile) throw new Error('Not a workout backup — no profile in the file.');
          await store.replace(data);
          view = 'today'; render();
        } catch (err) { alert(`Import failed. ${err.message}`); }
      };
      inp.click();
      break;
    }
    case 'reset':
      if (confirm('Erase your profile, plan and every logged workout? This cannot be undone.')) {
        await store.reset(); setupStep = 0; view = 'today'; sheet = null; render(); window.scrollTo(0, 0);
      }
      break;
  }
});

// Search types live; everything else commits on change.
let friendSearchTimer = null;
root.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;

  if (el.dataset.act === 'search') { search = el.value; render(); }

  if (el.dataset.act === 'weight-input') {
    // Track the typed value so the plate cue and the confirm button follow it,
    // without re-rendering on every keystroke (that would fight the caret).
    sheet = { ...sheet, value: el.value };
    const n = Number(el.value);
    const ex = store.getState().activeSession?.exercises[activeEx];
    if (ex && Number.isFinite(n) && n >= 0) {
      const cue = root.querySelector('.sheet .loadcue');
      if (cue) cue.innerHTML = hintHTML(store.hintFor(n, ex.loading));
      const apply = root.querySelector('[data-act="weight-apply"]');
      if (apply) apply.textContent = `Use ${fmtW(n)} lb`;
    }
  }

  if (el.dataset.act === 'friend-search') {
    const q = el.value;
    sheet = { ...sheet, query: q };
    clearTimeout(friendSearchTimer);
    if (q.trim().length < 2) { sheet.results = []; sheet.searching = false; render(); return; }

    // Debounced so a username search is not one request per keystroke.
    sheet.searching = true;
    friendSearchTimer = setTimeout(async () => {
      try {
        const r = await api.searchUsers(q);
        // Guard against a slow response landing after the user typed on.
        if (sheet?.kind === 'friends' && sheet.query === q) {
          sheet.results = r.users; sheet.searching = false; render();
        }
      } catch {
        if (sheet?.kind === 'friends') { sheet.searching = false; render(); }
      }
    }, 350);
  }
});

root.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'apply-preset' && el.value) {
    const p = PRESETS[el.value];
    if (confirm(`Replace your week with “${p.name}”? Your logged history and progress are kept.`)) {
      await store.applyPreset(el.value, p.defaultDays);
    }
    render();
  }
  if (act === 'set-inventory') {
    const inv = PRESET_INVENTORIES[el.value];
    if (inv) { const { label, ...rest } = inv; await store.setInventory(rest); render(); }
  }
  if (act === 'set-bw') { const w = Number(el.value); if (w > 0) { await store.logBodyweight(w); render(); } }
  if (act === 'set-ht') { const h = Number(el.value); if (h > 0) await store.updateProfile({ heightIn: h }); }
  if (act === 'rename-day') {
    const name = el.value.trim();
    if (name) await store.renameDay(el.dataset.v, name);
  }
});

// Escape closes the open sheet.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheet) closeSheet();
});

await store.load();

// The account check gates the first paint, so an already-signed-in user never
// sees the sign-in screen flash. It resolves from cache immediately when there
// is a stored session, so this is not a network wait.
await restoreAccount();
render();

// Sync when the app comes back to the foreground — the common case is finishing
// a workout, locking the phone, and opening it again later.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && account && !syncState.syncing) runSync();
});

// And the moment the signal comes back, which in a gym is often on the way out.
window.addEventListener('online', () => {
  syncState = { ...syncState, online: true };
  if (account) runSync();
});
window.addEventListener('offline', () => {
  syncState = { ...syncState, online: false };
  render();
});

// Register the service worker so the app opens and runs with no signal.
// Failure here is not fatal — it only costs offline support.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
