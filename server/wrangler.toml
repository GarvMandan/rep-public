name = "progressive-overload-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# The API imports ../../core/*.js so the server validates sets with the exact
# same progression math the app runs. One engine, no drift.

[[d1_databases]]
binding = "DB"
database_name = "progressive-overload"
database_id = "8b5a9fe3-caa9-47da-9f9a-921a5be86645"

[vars]
# Comma-separated. The first entry is the fallback for non-browser callers.
ALLOWED_ORIGINS = "https://garvmandan.github.io,http://localhost:5173,http://localhost:5195"

# Where the app lives — used to build links inside emails.
APP_URL = "https://garvmandan.github.io/rep-public"

# From the Google Cloud console. Public by design (it ships in the frontend).
GOOGLE_CLIENT_ID = ""

# Resend's shared sender works with no domain. Once you verify your own domain,
# change this to an address on it.
EMAIL_FROM = "Progressive Overload <onboarding@resend.dev>"

# Resend will not deliver to anyone but the account owner until a sending domain
# is verified, which requires owning a domain. Until then this stays "false" so
# friends and invites work for everyone without an email ever being needed.
# Set it to "true" once a domain is verified — no code change required.
REQUIRE_EMAIL_VERIFICATION = "false"

# RESEND_API_KEY is a secret, set with:
#   npx wrangler secret put RESEND_API_KEY
