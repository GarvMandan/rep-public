<title>Verify your email</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #12151A; --surface: #1A1F27; --line: #2C3441;
    --ink: #E8ECF2; --muted: #8C97A8; --accent: #E4FF3A; --down: #EF4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: grid; place-items: center; padding: 24px; line-height: 1.5;
  }
  .card {
    background: var(--surface); border-radius: 14px; padding: 32px 26px;
    max-width: 400px; width: 100%; text-align: center;
  }
  .mark { width: 52px; height: 52px; border-radius: 12px; margin-bottom: 18px; }
  h1 {
    font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700;
    margin: 0 0 10px; letter-spacing: -.01em;
  }
  p { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 9px;
    background: var(--accent); color: #0E1200; font-weight: 700; font-size: 15px;
    text-decoration: none; text-align: center; border: none; font-family: inherit; cursor: pointer;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 18px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  .ok { color: var(--accent); font-size: 40px; line-height: 1; margin-bottom: 14px; }
  .bad { color: var(--down); font-size: 40px; line-height: 1; margin-bottom: 14px; }
</style>

<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Verifying…</h1>
  <p>One moment.</p>
</div>

<script type="module">
import { createApi } from './core/api.js';
import { API_BASE } from './core/config.js';

const card = document.getElementById('card');
const api = createApi({
  baseUrl: API_BASE,
  tokenStore: {
    async get() { try { return localStorage.getItem('liftlog.token') || ''; } catch { return ''; } },
    async set(v) { try { localStorage.setItem('liftlog.token', v); } catch {} },
  },
});

const show = (icon, title, body, cta) => {
  card.innerHTML = `
    <div class="${icon === '✓' ? 'ok' : 'bad'}">${icon}</div>
    <h1>${title}</h1>
    <p>${body}</p>
    ${cta}`;
};

const token = new URLSearchParams(location.search).get('token');

if (!token) {
  show('!', 'Link incomplete', 'That verification link is missing its code. Try opening it again from your email.',
    '<a class="btn" href="./app.html">Open the app</a>');
} else {
  try {
    const r = await api.verifyEmail(token);
    show('✓',
      r.already ? 'Already verified' : 'Email verified',
      r.already
        ? 'This address was already confirmed. You are all set.'
        : 'You can now add friends and share workouts.',
      '<a class="btn" href="./app.html">Start training</a>');
  } catch (err) {
    show('!', 'Could not verify',
      err.offline ? 'You appear to be offline. Try this link again once you reconnect.' : err.message,
      '<a class="btn" href="./app.html">Open the app</a>');
  }
}
</script>
